<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>Snake Arena Admin</title><style>body{margin:0;background:#06100b;color:#f3fff8;font:15px system-ui;padding:18px}.wrap{max-width:900px;margin:auto}.card{background:#0d2117;border:1px solid #244a36;border-radius:18px;padding:16px;margin:12px 0}button,input,select{padding:10px;border-radius:10px;border:1px solid #315941;background:#07130c;color:white}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{padding:12px;background:#08150d;border-radius:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.player{padding:10px;border-top:1px solid #21432f}.muted{color:#8baa99}h1{margin:0}</style></head><body><div class="wrap"><div class="card"><h1>⚙️ Snake Arena Admin</h1><div id="status" class="muted">Проверка доступа…</div></div><div id="app" hidden><div id="stats" class="grid"></div><div class="card"><h3>👤 Игроки</h3><div class="row"><input id="q" placeholder="ID, username или имя"><button onclick="search()">Найти</button></div><div id="players"></div></div><div class="card"><h3>🎁 Выдать предмет</h3><div class="row"><input id="gid" placeholder="Telegram ID"><input id="coins" type="number" placeholder="Монеты"><input id="xp" type="number" placeholder="XP"><select id="skin"><option value="">Скин…</option></select><select id="field"><option value="">Поле…</option></select><button onclick="grant()">Выдать</button></div><p class="muted">Можно одновременно выдать монеты, XP, скин или поле. Покупка Stars остаётся обычной.</p></div><div class="card"><h3>⭐ Каталог Stars</h3><div id="catalog"></div></div></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();const headers=()=>tg?.initData?{'X-Telegram-Init-Data':tg.initData}:{};async function api(u,o={}){const r=await fetch(u,{...o,headers:{...headers(),...(o.headers||{})}});return r.json()}async function init(){const m=await api('/api/admin/me');if(!m.admin){document.getElementById('status').textContent='⛔ Доступ запрещён';return}document.getElementById('status').textContent='✅ Доступ администратора';document.getElementById('app').hidden=false;const s=await api('/api/admin/stats');document.getElementById('stats').innerHTML=`<div class=stat>👥 Игроков<br><b>${s.players.count}</b></div><div class=stat>🪙 Монет<br><b>${s.players.coins}</b></div><div class=stat>⭐ Продано Stars<br><b>${s.payments.stars}</b></div><div class=stat>💳 Платежей<br><b>${s.payments.count}</b></div>`;const cat=await api('/api/me');if(cat?.player){let ss=cat.player.skins.filter(x=>x.currency==='stars'),ff=cat.player.fields.filter(x=>x.currency==='stars');document.getElementById('skin').innerHTML+=[...ss].map(x=>`<option value="${x.id}">${x.emoji} ${x.name} — ${x.price}⭐</option>`).join('');document.getElementById('field').innerHTML+=[...ff].map(x=>`<option value="${x.id}">${x.emoji} ${x.name} — ${x.price}⭐</option>`).join('');document.getElementById('catalog').innerHTML='<b>Скины:</b> '+ss.map(x=>`${x.emoji} ${x.name} ${x.price}⭐`).join(' · ')+'<br><b>Поля:</b> '+ff.map(x=>`${x.emoji} ${x.name} ${x.price}⭐`).join(' · ')}search()}async function search(){const d=await api('/api/admin/players?q='+encodeURIComponent(document.getElementById('q').value));document.getElementById('players').innerHTML=d.players.map(p=>`<div class=player><b>${p.first_name||''} ${p.username?'@'+p.username:''}</b> · ID ${p.telegram_id}<br>🪙 ${p.coins} · XP ${p.xp} · 🏆 ${p.best_score}<br>🐍 ${p.skin} · 🗺 ${p.field_skin} <button onclick="gid.value='${p.telegram_id}'">Выбрать</button></div>`).join('')||'Нет игроков'}async function grant(){const d=await api('/api/admin/player/grant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_id:gid.value,coins:coins.value,xp:xp.value,skin:skin.value,field:field.value})});alert(d.ok?'✅ Выдано':'❌ '+(d.error||'Ошибка'));if(d.ok)search()}init()</script></body></html>
